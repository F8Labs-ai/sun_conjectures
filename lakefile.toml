name = "sun_conjectures"
version = "1.0.0"
keywords = ["math", "number theory", "primes"]
defaultTargets = ["SunConjectures"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "SunConjectures"

# Counterexamples to Conjectures 2.4(ii) and 2.9 (arXiv:1208.2683). Not a default target: the
# kernel check takes about 30 min and about 13 GB of build output. Build with `lake build Sunproj`.
[[lean_lib]]
name = "Sunproj"
